app = "common-ground"
primary_region = "sin"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_URL = "https://common-ground.fly.dev"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/var/www/html/storage/database/database.sqlite"

[mounts]
  source = "marketplace_data"
  destination = "/var/www/html/storage"

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
